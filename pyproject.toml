[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "A privacy-conscious assistant for finding and managing job applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.52,<1",
    "httpx>=0.27,<1",
    "playwright>=1.49,<2",
    "pydantic>=2.7,<3",
    "pypdf>=5,<7",
    "psycopg[binary]>=3.1,<4",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "SQLAlchemy>=2,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
job-agent = "agent.main:main"
job-apply = "agent.applier.cli:main"
job-dashboard = "agent.dashboard:main"
job-run = "agent.pipeline:main"
job-agent-fill = "agent.form_agent:main"
job-company-pages = "agent.careers_agent:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["agent*", "db*"]

[tool.setuptools.package-data]
agent = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
