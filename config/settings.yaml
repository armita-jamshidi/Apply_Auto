# Local database file (git-ignored). Set DATABASE_URL in .env to use Postgres instead.
database_url: sqlite:///data/job_agent.db
fit_score_threshold: 70
anthropic_model: claude-sonnet-5-5
location:
  include_hybrid_nc: true
network:
  max_retries: 3
  backoff_seconds: 0.5
discovery:
  # Keep early-career, mid-level, and unstated-level roles; add senior to widen.
  experience_levels: [early, mid, unknown]
  # Drop roles whose description requires more than this many years of experience. A
  # mid-level role (for example "Engineer II") must state that it needs this many or fewer.
  max_years_experience: 2
  # Also read these remote job boards and forums: weworkremotely (RSS feed) and hackernews
  # (the monthly "Who is hiring?" thread). Remove an entry to stop reading it.
  remote_boards: [weworkremotely, hackernews]
  # Keep at most this many open jobs per company, the best fit scores first.
  max_jobs_per_company: 2
  # Also search companies from the public SimplifyJobs New-Grad-Positions list.
  include_new_grad_list: true
  # Never keep internships, co-ops, or new-grad roles (matched in titles), or postings that
  # say they are for new graduates (matched in descriptions). Set a list to [] to allow them.
  exclude_title_keywords:
    - intern
    - interns
    - internship
    - internships
    - co-op
    - co-ops
    - coop
    - co op
    - new grad
    - new grads
    - new-grad
    - new graduate
    - new graduates
    - recent grad
    - recent graduate
    - university grad
    - university graduate
  exclude_description_phrases:
    - new grad
    - new grads
    - new-grad
    - new graduate
    - new graduates
    - new college grad
    - new college graduate
  # Keep only AI and agent engineering roles: a title must contain one of title_keywords
  # (the AI side) and one of title_role_keywords (the engineering side), for example
  # "AI Engineer", "Agent Engineer", "Machine Learning Engineer", or "Forward Deployed
  # Engineer, Agentic Platform". Remove a list to drop that requirement.
  title_keywords:
    - ai
    - a.i.
    - artificial intelligence
    - agent
    - agents
    - agentic
    - llm
    - llms
    - genai
    - gen ai
    - generative ai
    - machine learning
    - ml
    - ai/ml
    - ml/ai
    - deep learning
    - nlp
    - applied ai
    - conversational ai
  title_role_keywords:
    - engineer
    - engineers
    - engineering
    - developer
    - swe
    - scientist
    - researcher
    - research engineer
    - architect
safeguards:
  daily_application_cap: 5
  company_monthly_application_cap: 5
