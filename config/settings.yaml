# Local database file (git-ignored). Set DATABASE_URL in .env to use Postgres instead.
database_url: sqlite:///data/job_agent.db
fit_score_threshold: 70
anthropic_model: claude-sonnet-5-5
# Model for the form agent that fills unfamiliar forms (Workday, career pages, custom widgets).
form_agent_model: claude-opus-5-5
# Model for the careers agent that finds third-party jobs on the company's own site.
careers_agent_model: claude-sonnet-5-5
# Model for the resume tailor that rewrites the resume around a job's exact keywords.
resume_tailor_model: claude-opus-5-5
location:
  include_hybrid_nc: true
network:
  max_retries: 3
  backoff_seconds: 0.5
discovery:
  # Keep early-career, mid-level, and unstated-level roles; add senior to widen.
  experience_levels: [early, mid, unknown]
  # Drop roles whose description requires more than this many years of experience (so 3+
  # years is dropped). A mid-level role (for example "Engineer II") must state that it needs
  # this many or fewer. Jobs already found are checked again on every run.
  max_years_experience: 2
  # Also read these remote job boards and forums: weworkremotely (RSS feed), hackernews
  # (the monthly "Who is hiring?" thread), and himalayas (job search API, searched for AI,
  # ML, LLM, and agent engineer roles open to the US). Remove an entry to stop reading it.
  remote_boards: [weworkremotely, hackernews, himalayas]
  # Keep at most this many open jobs per company, the best matches first (prepared jobs,
  # then the highest fit scores, then the newest). The dashboard shows no more than this.
  max_jobs_per_company: 3
  # Skip postings published more than this many days ago (jobs with no date are kept).
  max_posting_age_days: 60
  # Postings at most this many days old count as fresh: they are listed, looked up, and
  # prepared first so you can apply early, and the dashboard can show only them.
  fresh_posting_days: 7
  # Each run, look up at most this many jobs from third-party sites on the companies' own
  # careers pages (newest postings first). Each lookup makes several model calls.
  careers_agent_limit: 5
  # Also search companies from the public SimplifyJobs New-Grad-Positions list.
  include_new_grad_list: true
  # Never keep internships or co-ops (matched in titles). New-grad roles are kept: you
  # graduated in December 2025. Add phrases to exclude_description_phrases to drop postings
  # whose description contains them.
  exclude_title_keywords:
    - intern
    - interns
    - internship
    - internships
    - co-op
    - co-ops
    - coop
    - co op
  exclude_description_phrases: []
  # Keep only AI and agent engineering roles: a title must contain one of title_keywords
  # (the AI side) and one of title_role_keywords (the engineering side), for example
  # "AI Engineer", "Agent Engineer", "Machine Learning Engineer", or "Forward Deployed
  # Engineer, Agentic Platform". Remove a list to drop that requirement.
  title_keywords:
    - ai
    - a.i.
    - artificial intelligence
    - agent
    - agents
    - agentic
    - llm
    - llms
    - genai
    - gen ai
    - generative ai
    - machine learning
    - ml
    - ai/ml
    - ml/ai
    - deep learning
    - nlp
    - applied ai
    - conversational ai
  title_role_keywords:
    - engineer
    - engineers
    - engineering
    - developer
    - swe
    - scientist
    - researcher
    - research engineer
    - architect
# The morning run (job-daily): find, score, and prepare new jobs so each good match has a
# tailored resume and every answer waiting in the dashboard by ready_by. Register it with
# `job-daily --install`; it starts start_hours_before hours earlier.
daily_run:
  ready_by: "09:00"
  timezone: America/New_York
  start_hours_before: 2
  # Build the kit (tailored resume and answers) for at most this many new jobs each morning,
  # best and freshest first. Each kit makes several model calls.
  kit_limit: 10
safeguards:
  daily_application_cap: 5
  company_monthly_application_cap: 5
