# Local database file (git-ignored). Set DATABASE_URL in .env to use Postgres instead.
database_url: sqlite:///data/job_agent.db
fit_score_threshold: 70
anthropic_model: claude-sonnet-5-5
location:
  include_hybrid_nc: true
network:
  max_retries: 3
  backoff_seconds: 0.5
discovery:
  # Keep early-career roles and roles that state no level; add mid or senior to widen.
  experience_levels: [early, unknown]
  # Also search companies from the public SimplifyJobs New-Grad-Positions list.
  include_new_grad_list: true
  # Keep only titles containing one of these words. Remove the list to keep every role.
  title_keywords:
    - engineer
    - engineering
    - developer
    - software
    - swe
    - data
    - machine learning
    - ml
    - ai
    - analyst
    - scientist
    - research
    - full stack
    - fullstack
    - backend
    - frontend
    - platform
    - infrastructure
    - security
    - forward deployed
    - solutions engineer
    - technical
safeguards:
  daily_application_cap: 5
  company_monthly_application_cap: 5
